<div class="track-row">
    {% if not track.album_id %}
        {% if track.cover_url %}
            <img
                class="track-cover"
                src="{{ track.cover_url }}"
                alt="{{ track.title }}"
            >
        {% else %}
            <div class="track-cover placeholder">♪</div>
        {% endif %}
    {% endif %}

    <div class="track-info">
        <strong>{{ track.title }}</strong>
        <span>
            {{ 'reference' if track.is_reference else 'not reference' }}
            ·
            {{ 'processed' if track.processed else 'not processed' }}
        </span>
    </div>

    <div class="actions">
        {% if not track.album_id %}
            <form
                method="post"
                enctype="multipart/form-data"
                class="inline-form"
            >
                <input type="hidden" name="action" value="update_cover">
                <input type="hidden" name="entity" value="track">
                <input type="hidden" name="artist_id" value="{{ track.artist_id }}">
                <input type="hidden" name="album_id" value="None">
                <input type="hidden" name="track_id" value="{{ track.track_id }}">
                <input type="file" name="cover_file" accept="image/*" required>
                <button class="small-button">
                    Оновити обкладинку
                </button>
            </form>
        {% else %}
            <form method="post" class="inline-form processing-form">
                <input type="hidden" name="action" value="process_track">
                <input type="hidden" name="artist_id" value="{{ track.artist_id }}">
                <input type="hidden" name="album_id" value="{{ track.album_id }}">
                <input type="hidden" name="track_id" value="{{ track.track_id }}">
                <button class="small-button loading-button">
                    Обробити
                </button>
            </form>
        {% endif %}

        <form method="post" class="inline-form">
            <input
                type="hidden"
                name="action"
                value="toggle_track_reference"
            >
            <input
                type="hidden"
                name="artist_id"
                value="{{ track.artist_id }}"
            >
            <input
                type="hidden"
                name="album_id"
                value="{{ track.album_id or '' }}"
            >
            <input
                type="hidden"
                name="track_id"
                value="{{ track.track_id }}"
            >

            <button class="small-button">
                {% if track.is_reference %}
                    Прибрати reference
                {% else %}
                    Зробити reference
                {% endif %}
            </button>
        </form>

        <form method="post" class="inline-form danger-form">
            <input type="hidden" name="action" value="delete_track">
            <input type="hidden" name="artist_id" value="{{ track.artist_id }}">
            <input
                type="hidden"
                name="album_id"
                value="{{ track.album_id or 'None' }}"
            >
            <input type="hidden" name="track_id" value="{{ track.track_id }}">
            <button class="small-button danger">
                Видалити
            </button>
        </form>

    </div>
</div>
